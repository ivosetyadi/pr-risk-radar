# Example consumer workflow. Copy into your repo at
# .github/workflows/risk-radar.yml
name: PR Risk Radar
on: pull_request
permissions:
  contents: read
  pull-requests: write
jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: ivosetyadi/pr-risk-radar@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          fail-above: 101   # advisory only; set to e.g. 80 to block Critical PRs
